<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <button id="read">Call read_url</button>
  <pre id="out"></pre>
  <script>
    const out = document.getElementById('out');
    const readUrl = () => {
      out.textContent += 'calling read_url\n';
      window.__TAURI__.core.invoke('read_url').then(
        (line) => { out.textContent += line + '\n'; },
        (e) => { out.textContent += 'error ' + e + '\n'; });
    };
    document.getElementById('read').addEventListener('click', readUrl);
    readUrl();
  </script>
</body>
</html>
